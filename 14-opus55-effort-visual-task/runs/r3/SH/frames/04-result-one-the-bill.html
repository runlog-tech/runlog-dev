      <div id="s04" data-composition-id="04-result-one-the-bill" data-width="1920" data-height="1080">

            <div class="blk dim" style="left:0;width:960px"></div>
            <div class="abs" id="marker"></div>
            <div class="abs" id="marklbl">RESET POINT</div>
            <div id="litblks"></div>
            <div class="abs stripcap" id="cap2" style="left:1040px;top:128px;color:#f2b84b">8 FOLLOW-UP TURNS: THE COST WE ADD UP</div>
          </div>
          <div class="abs chips" id="chips">
            <div class="chip" id="chipA"><div class="k">SOURCE</div><div class="v">usage ledger</div></div>

          <div class="abs" id="refline"></div>

          <div id="rows"></div>
        </div>

        <!-- right column panels -->

          <div class="eyebrow" style="color:#3ddc97">A RESET HALVES THE BILL</div>
          <div class="big" style="font-size:78px;margin-top:26px">Roughly<br>half.</div>
          <div class="card" style="margin-top:40px">
            <div class="mini" style="margin-top:0;height:90px"><div class="ml" style="width:400px;font-size:22px;color:#f08a5d;letter-spacing:.12em">NO RESET</div><div class="mv mono" style="left:0;top:30px;font-size:52px;color:#f08a5d">$0.95</div></div>
            <div class="mini" style="margin-top:22px;height:90px"><div class="ml" style="width:400px;font-size:22px;color:#3ddc97;letter-spacing:.12em">WITH A RESET</div><div class="mv mono" style="left:0;top:30px;font-size:52px;color:#3ddc97">$0.53 to $0.73</div></div>

            <div class="mini" id="mB1" style="margin-top:20px"><div class="ml">/compact</div><div class="mb" id="mB1b" style="width:188px;background:#3ddc97"></div><div class="mv" id="mB1v" style="left:174px;color:#08090c;font-size:24px;top:3px">about 47k</div></div>
            <div class="mini" id="mB2" style="margin-top:12px"><div class="ml">handoff</div><div class="mb" id="mB2b" style="width:276px;background:#9a8cff"></div><div class="mv" id="mB2v" style="left:174px;color:#08090c;font-size:24px;top:3px">60k to 69k</div></div>

        <div class="abs panel" id="p4">
          <div class="big" style="font-size:84px;margin-top:150px" id="p4a">The mods<br>save you<br>money.</div>

        </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector('#s04 ' + s);
          const E = 'power3.out';

          const COLORS = { noreset: '#f08a5d', subagent: '#f08a5d', compact: '#3ddc97', brief: '#7aa2c9', auto: '#9a8cff', hc: '#9a8cff' };
          const ROWS = [
            { id: 'noreset', name: 'no reset', tag: '', v: 0.95, t: 8.96 },
            { id: 'subagent', name: 'subagent', tag: '', v: 1.20, t: 11.80 },
            { id: 'compact', name: '/compact', tag: '', v: 0.53, t: 14.72 },
            { id: 'brief', name: 'brief handoff', tag: '', v: 0.57, t: 17.04 },
            { id: 'auto', name: 'claude-auto-handoff', tag: 'COMMUNITY MOD', v: 0.66, t: 18.82 },
            { id: 'hc', name: 'handoff-compact', tag: 'COMMUNITY MOD', v: 0.73, t: 20.72 },
          ];
          const SORTED = ['compact', 'brief', 'auto', 'hc', 'noreset', 'subagent'];
          const ROW_H = 104, ROW_Y0 = 80, BAR_W = 700, MAXV = 1.2;

          // build rows
          const rowsEl = $('#rows');
          ROWS.forEach((r, i) => {
            const el = document.createElement('div');
            el.className = 'abs row'; el.id = 's04-row-' + r.id;
            el.innerHTML = '<div class="rin" id="s04-rin-' + r.id + '">' +
              '<div class="nm" style="color:' + (r.tag ? '#cbc3ff' : '#eef1f6') + '">' + r.name + '</div>' +
              (r.tag ? '<div class="tg">' + r.tag + '</div>' : '') +
              '<div class="trk"></div>' +
              '<div class="bar" id="s04-bar-' + r.id + '" style="width:' + Math.round(r.v / MAXV * BAR_W) + 'px;background:' + COLORS[r.id] + '"></div>' +
              '<div class="val" id="s04-val-' + r.id + '" style="left:440px;color:#08090c">$0.00</div>' +
              (r.id === 'compact' ? '<div class="cheap" id="s04-cheap" style="left:' + (420 + Math.round(r.v / MAXV * BAR_W) + 20) + 'px">CHEAPEST</div>' : '') +
              '</div>';
            rowsEl.appendChild(el);
            r.el = el; r.rin = el.querySelector('.rin');
            r.bar = el.querySelector('.bar'); r.val = el.querySelector('.val');
            gsap.set(el, { y: ROW_Y0 + i * ROW_H });
          });

          // lit blocks T1..T8
          const lit = $('#litblks');
          for (let i = 0; i < 8; i++) {
            const b = document.createElement('div');
            b.className = 'blk lit'; b.id = 's04-t' + i;
            b.style.left = (1040 + i * 90) + 'px'; b.style.width = '76px';
            b.textContent = 'T' + (i + 1);
            lit.appendChild(b);
          }

          /* initial states */
          gsap.set(['#s04 #mckick', '#s04 #mcl1', '#s04 #mcl2', '#s04 #cap1', '#s04 #cap2', '#s04 #marker', '#s04 #marklbl', '#s04 #chipA', '#s04 #chipB', '#s04 #chipC', '#s04 .blk', '#s04 #strip'], { opacity: 0 });
          gsap.set('#s04 #badge', { opacity: 0 });
          gsap.set(['#s04 #chead', '#s04 #refline', '#s04 #reflbl', '#s04 #brk'], { opacity: 0 });
          ROWS.forEach((r) => { gsap.set(r.rin, { opacity: 0 }); gsap.set(r.bar, { scaleX: 0 }); gsap.set(r.val, { opacity: 0 }); });
          gsap.set('#s04 #s04-cheap', { opacity: 0, scale: 0.6, transformOrigin: '0 50%' });
          gsap.set(['#s04 #p1', '#s04 #p2', '#s04 #p3', '#s04 #p4'], { opacity: 0 });
          gsap.set(['#s04 #p2pill', '#s04 #p2inst', '#s04 #p2beat', '#s04 #cA', '#s04 #cB', '#s04 #mB1', '#s04 #mB2', '#s04 #mB3', '#s04 #mB3t', '#s04 #mB3n', '#s04 #p1note', '#s04 #p4a', '#s04 #p4b'], { opacity: 0 });
          gsap.set(['#s04 #mB1b', '#s04 #mB2b', '#s04 #mB3b'], { scaleX: 0 });

          const rise = (sel, t, d = 0.6, y = 30) => tl.fromTo(sel, { opacity: 0, y: y }, { opacity: 1, y: 0, duration: d, ease: E }, t);

          /* ---- phase 1: 0.26 -> 8.4 ---- */
          tl.fromTo('#s04 #badge', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 0.26);
          tl.to('#s04 #mckick', { opacity: 1, duration: 0.5 }, 1.1);
          rise('#s04 #mcl1', 2.06, 0.7, 40);
          rise('#s04 #mcl2', 3.16, 0.7, 40);
          tl.to('#s04 #strip', { opacity: 1, duration: 0.4 }, 3.3);
          tl.to('#s04 #cap1', { opacity: 1, duration: 0.5 }, 3.3);
          tl.to('#s04 #strip .blk.dim', { opacity: 1, duration: 0.5 }, 3.3);
          tl.fromTo('#s04 #marker', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: E, transformOrigin: '50% 100%' }, 3.5);
          tl.fromTo('#s04 #marklbl', { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: E }, 3.7);
          for (let i = 0; i < 8; i++) tl.fromTo('#s04 #s04-t' + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: E }, 3.9 + i * 0.1);
          tl.to('#s04 #cap2', { opacity: 1, duration: 0.5 }, 4.6);
          rise('#s04 #chipA', 4.16, 0.5, 20);
          rise('#s04 #chipB', 4.46, 0.5, 20);
          tl.fromTo('#s04 #chipC', { opacity: 0, y: 20, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.8)' }, 6.08);

          // hand over to chart
          tl.to(['#s04 #mckick', '#s04 #mcl1', '#s04 #mcl2', '#s04 #strip', '#s04 #chips'], { opacity: 0, y: -24, duration: 0.6, ease: 'power2.in' }, 7.7);

          /* ---- phase 2: bars, timed to spoken prices ---- */
          tl.to('#s04 #chead', { opacity: 1, duration: 0.5 }, 8.1);
          ROWS.forEach((r, i) => {
            tl.fromTo(r.rin, { opacity: 0, x: -30 }, { opacity: 0.4, x: 0, duration: 0.5, ease: E }, 8.2 + i * 0.07);
          });
          ROWS.forEach((r) => {
            tl.to(r.rin, { opacity: 1, duration: 0.3 }, r.t - 0.1);
            tl.to(r.bar, { scaleX: 1, duration: 1.0, ease: 'power3.out' }, r.t);
            tl.to(r.val, { opacity: 1, duration: 0.2 }, r.t + 0.35);
            const o = { n: 0 };
            tl.to(o, { n: r.v, duration: 0.7, ease: 'power2.out', onUpdate: () => { r.val.textContent = '$' + o.n.toFixed(2); } }, r.t + 0.35);
          });

          // focus helper: highlight a set of rows, dim the rest
          const focus = (ids, t) => ROWS.forEach((r) => tl.to(r.rin, { opacity: ids.includes(r.id) ? 1 : 0.62, duration: 0.5 }, t));
          const unfocus = (t) => ROWS.forEach((r) => tl.to(r.rin, { opacity: 1, duration: 0.5 }, t));

          /* ---- 22.4 -> 30: a reset roughly halves it ---- */
          unfocus(22.9);
          tl.to('#s04 #chart', { scale: 0.8, y: 70, duration: 1.0, ease: 'power3.inOut' }, 24.0);
          tl.set('#s04 #p1', { opacity: 1 }, 24.2);
          rise('#s04 #p1 .eyebrow', 24.4, 0.5, 20);
          rise('#s04 #p1 .big', 24.9, 0.7, 30);
          ROWS.forEach((r) => {
            const k = SORTED.indexOf(r.id);
            tl.to(r.el, { y: ROW_Y0 + k * ROW_H, duration: 1.0, ease: 'power3.inOut' }, 24.6);
          });
          tl.to(['#s04 #refline', '#s04 #reflbl'], { opacity: 1, duration: 0.5 }, 25.6);
          tl.fromTo('#s04 #refline', { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: E, transformOrigin: '50% 0' }, 25.6);
          tl.fromTo('#s04 #brk', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.7, ease: E, transformOrigin: '50% 0' }, 26.6);
          tl.fromTo('#s04 #p1 .card', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 26.4);
          tl.fromTo('#s04 #p1note', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 28.2);

          /* ---- 30.8 -> 41: /compact cheapest ---- */
          tl.to('#s04 #p1', { opacity: 0, x: 40, duration: 0.5, ease: 'power2.in' }, 30.3);
          tl.to(['#s04 #brk'], { opacity: 0, duration: 0.4 }, 30.6);
          tl.set('#s04 #p2', { opacity: 1 }, 30.8);
