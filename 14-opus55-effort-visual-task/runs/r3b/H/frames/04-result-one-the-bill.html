      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const qa = (s) => document.querySelectorAll(s);

          const stageIn = (el, t) => tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, t);
          const stageOut = (el, t) => tl.to(el, { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, t);
          const pop = (el, t) =>
            tl.fromTo(el, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.05, duration: 0.18, ease: "power2.out" }, t)
              .to(el, { scale: 1, duration: 0.14, ease: "power2.inOut" }, t + 0.18);
          const headSwap = (from, to, t) => {
            if (from) tl.to(from, { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, t - 0.3);
            tl.fromTo(to, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t);
          };
          const money = (el, to, t, dur) => {
            const o = { v: 0 };
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t);
            tl.fromTo(o, { v: 0 }, { v: to, duration: dur, ease: "power2.out", onUpdate: () => { el.textContent = "$" + o.v.toFixed(2); } }, t);
          };
          const tokens = (el, from, to, t, dur, prefix) => {
            const o = { v: from };
            tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: "power2.out", onUpdate: () => { el.textContent = (prefix || "") + Math.round(o.v) + "k"; } }, t);
          };

          // badge
          tl.fromTo(q("#b04-badge"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.2);

          // STAGE 1 (0 to 8.4)
          stageIn(q("#b04-s1"), 0.3);
          const titleWords = qa("#b04-s1-title span");
          const wordT = [2.06, 2.36, 2.52, 2.82, 3.16, 3.4, 3.5, 3.86];
          titleWords.forEach((w, i) => tl.fromTo(w, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, wordT[i] - 0.1));
          tl.fromTo(q("#b04-sp-win"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 4.0);
          tl.fromTo(q("#b04-sp-stat"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 4.46);
          tl.fromTo(q("#b04-sp-model"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 6.0);
          tl.fromTo(q("#b04-sp-model .b04-v"), { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "left center" }, 6.2);
          tl.fromTo(q("#b04-sp-src"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 7.0);
          stageOut(q("#b04-s1"), 8.3);

          // STAGE 2 (8.7 to 41.0)
          stageIn(q("#b04-s2"), 8.7);
          tl.fromTo(q("#b04-s2-eyebrow"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.8);
          headSwap(null, q("#b04-h1"), 8.9);
          const rowOrder = [
            ["#b04-r-noreset", 9.2, 0.95],
            ["#b04-r-subagent", 11.8, 1.2],
            ["#b04-r-compact", 14.72, 0.53],
            ["#b04-r-brief", 17.14, 0.57],
            ["#b04-r-cah", 18.82, 0.66],
            ["#b04-r-hc", 20.86, 0.73],
          ];
