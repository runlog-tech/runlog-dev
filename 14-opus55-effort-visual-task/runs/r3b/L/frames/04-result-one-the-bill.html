    { l:'subagent', v:1.20, t:11.70, c:'#f87171' },
    { l:'/compact', v:0.53, t:14.72, c:'#5eead4' },
    { l:'brief handoff', v:0.57, t:17.04, c:'#eae6da' },
    { l:'claude-auto-handoff', v:0.66, t:18.82, c:'#fbbf24' },
    { l:'handoff-compact', v:0.73, t:20.72, c:'#fbbf24' },
  ];
  const MAXW = 1000, SCALE = MAXW / 1.20, top0 = 200, gap = 118;
  const host = q('#rows');
  rows.forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'b-row'; d.style.top = (top0 + i * gap) + 'px';
    d.innerHTML = `<div class="lbl">${r.l}</div><div class="track"><div class="bar" style="background:${r.c};opacity:.85"></div><div class="val" style="left:${r.v*SCALE+24}px;color:${r.c}">$${r.v.toFixed(2)}</div></div>`;
    host.appendChild(d); r.el = d;
  });
  const halfX = 120 + 500 + 0.475 * SCALE;
  q('#half').style.left = halfX + 'px'; q('#halflbl').style.left = (halfX - 120) + 'px';

  const tl = gsap.timeline({ paused: true });
  const swapIn = (s, t) => tl.fromTo(q(s), { opacity:0, y:30 }, { opacity:1, y:0, duration:.6, ease:'power2.out' }, t);
  const swapOut = (s, t) => tl.to(q(s), { opacity:0, y:-30, duration:.4, ease:'power2.in' }, t);
  const pop = (el, t) => tl.fromTo(el, { scale:.8, opacity:0 }, { keyframes:[{ scale:1.05, opacity:1, duration:.25 }, { scale:1, duration:.15 }] }, t);

  // S1
  tl.from(q('#b-badge'), { opacity:0, x:-30, duration:.5 }, 0.2);
  swapIn('#s1', 1.6);
  tl.from(q('#s1a'), { opacity:0, y:20, duration:.5 }, 4.4);
  pop(q('#s1b span'), 6.08);
  swapOut('#s1', 8.3);

  // S2 bars
  swapIn('#s2', 8.7);
  rows.forEach(r => {
    tl.to(r.el, { opacity:1, duration:.3 }, r.t);
    tl.to(r.el.querySelector('.bar'), { width: r.v * SCALE, duration:.8, ease:'power3.out' }, r.t);
    pop(r.el.querySelector('.val'), r.t + .4);
  });
  tl.fromTo(q('#half'), { opacity:0, scaleY:0, transformOrigin:'top' }, { opacity:1, scaleY:1, duration:.6 }, 25.3);
  tl.to(q('#halflbl'), { opacity:1, duration:.4 }, 25.5);
  [3,4].forEach(i => tl.to(rows[i].el, { x:20, yoyo:true, repeat:1, duration:.3 }, 27.8));

  tl.to(rows[2].el.querySelector('.val'), { scale:1.25, transformOrigin:'left center', duration:.4 }, 31.1);
  swapOut('#s2', 32.3);

  pop(q('#s3n'), 32.7);
  tl.from(q('#s3a'), { opacity:0, y:20, duration:.5 }, 36.7);
  tl.from(q('#s3b'), { opacity:0, duration:.4 }, 38.0);
  q('#s3b').querySelectorAll('.strike').forEach((s, i) => tl.to(s, { width:'100%', duration:.35, ease:'power2.out' }, 38.6 + i * .3));
  swapOut('#s3', 41.0);

  tl.from(q('#term'), { opacity:0, y:30, duration:.5 }, 42.0);

  swapOut('#s4a', 45.0);

  swapIn('#s4b', 45.3);
  const CK = 1000 / 100;
  tl.to(q('#f1'), { width: 69 * CK, duration:1.0, ease:'power3.out' }, 46.3);
  tl.set(q('#n1'), { left: 69 * CK + 24 }, 0);
  pop(q('#n1'), 46.6);
  tl.to(q('#f2'), { width: 47 * CK, duration:1.0, ease:'power3.out' }, 50.0);
  tl.set(q('#n2'), { left: 47 * CK + 24 }, 0);
  pop(q('#n2'), 50.4);
  tl.to(q('#f1'), { width: 93 * CK, backgroundColor:'#f87171', duration:1.0 }, 55.0);
  tl.to(q('#n1'), { x: (93 - 69) * CK, duration:1.0 }, 55.0);
  tl.to(q('#s4c'), { opacity:1, duration:.4 }, 55.0);
  tl.to(q('#s4d'), { opacity:1, duration:.4 }, 56.8);
  swapOut('#s4b', 59.4);

  // S5 verdict
  swapIn('#s5', 59.8);
  tl.to(q('#s5b'), { opacity:1, duration:.5 }, 61.5);
  pop(q('#s5b span'), 61.6);
  tl.to(q('#s5c'), { opacity:1, duration:.4 }, 62.5);

})();
