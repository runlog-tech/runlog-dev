      <div id="s04" data-composition-id="04-result-one-the-bill" data-width="1920" data-height="1080">

              <div class="rk arch cy">01</div><div class="rn cy">/compact</div><div class="rv arch cy">$0.53</div></div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector("#s04 " + s);
          const IN = (el, t, d) => tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: d || 0.6, ease: "power2.out" }, t);
          const OUT = (el, t) => tl.to(el, { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, t);
          const POP = (el, t) => {
            tl.fromTo(el, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.05, duration: 0.18, ease: "power2.out" }, t);
            tl.to(el, { scale: 1, duration: 0.14, ease: "power2.inOut" }, t + 0.18);
          };
          const TICK = (el, to, t, d, fmt) => {
            const o = { v: 0 };
            tl.fromTo(o, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, t);
          };
          const WIPE = (el, t, d) => tl.fromTo(el, { clipPath: "inset(0 100% 0 0)", opacity: 1 }, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "none" }, t);

          // ---- stage 0 (0 to 1.9)
          IN("#s04 #s0e", 0.26, 0.5);
          tl.fromTo("#s04 #s0h", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1.04, duration: 0.3, ease: "power2.out" }, 1.0);
          tl.to("#s04 #s0h", { scale: 1, duration: 0.2 }, 1.3);
          tl.fromTo("#s04 #st0", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
          tl.to("#s04 #st0", { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, 1.7);
          tl.fromTo("#s04 #badge", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.9);

          // ---- stage 1 (1.9 to 7.4)
          tl.fromTo("#s04 #st1", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.9);
          const w1 = document.querySelectorAll("#s04 #s1h .w");
          const t1 = [2.06, 2.36, 2.52, 2.82, 3.16, 3.4, 3.5, 3.86];
          w1.forEach((w, i) => tl.fromTo(w, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t1[i]));
          POP("#s04 #m1", 4.46); tl.fromTo("#s04 #mi1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.6);
          POP("#s04 #m2", 5.4); tl.fromTo("#s04 #mi2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.6);
          POP("#s04 #m3", 6.08);
          OUT("#s04 #st1", 7.2);

          // ---- stage 2 chart (7.7 to 36)
          const rows = [
            { id: "noreset", name: "No reset", v: 0.95, t: 8.96, d: 1.5, rank: 4 },
            { id: "sub", name: "Subagent", v: 1.2, t: 11.7, d: 1.5, rank: 5, color: "#f87171" },
            { id: "compact", name: "/compact", v: 0.53, t: 14.72, d: 1.4, rank: 0 },
            { id: "brief", name: "Brief handoff", v: 0.57, t: 17.04, d: 1.2, rank: 1 },
            { id: "cah", name: "claude-auto-handoff", v: 0.66, t: 18.82, d: 1.3, rank: 2, mod: true },
            { id: "hc", name: "handoff-compact", v: 0.73, t: 20.72, d: 1.3, rank: 3, mod: true },
          ];
          const X0 = 140, LAB = 600, BAR = 800, MAX = 1.2, PITCH = 132, TOP = 215;
          const chart = $("#chart");
          rows.forEach((r, i) => {
            const el = document.createElement("div");
            el.className = "row";
            el.id = "row-" + r.id;
            el.style.top = TOP + i * PITCH + "px";
            el.innerHTML =
              '<div class="hl" id="hl-' + r.id + '"></div>' +
              '<div class="nm" id="nm-' + r.id + '"><span>' + r.name + "</span>" + (r.mod ? '<span class="tag mono" id="mod-' + r.id + '">Mod</span>' : "") + "</div>" +
              '<div class="bw"><span class="bar" id="bar-' + r.id + '"></span><span class="val arch" id="val-' + r.id + '">$0.00</span></div>';
            chart.appendChild(el);
            r.el = el;
          });
          const refX = (v) => X0 + LAB + (v / MAX) * BAR;
          const place = (id, x) => { const e = $(id); e.style.left = x - 1 + "px"; };
          place("#ref1", refX(0.95)); $("#ref1l").style.left = refX(0.95) + "px";
          place("#ref2", refX(0.475)); $("#ref2l").style.left = refX(0.475) + "px";

          tl.fromTo("#s04 #chart", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 7.7);
          tl.fromTo("#s04 #ct", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 7.9);
          tl.fromTo("#s04 #cl", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 8.3);

          rows.forEach((r) => {
            tl.fromTo(r.el, { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, r.t - 0.05);
            tl.fromTo("#s04 #bar-" + r.id, { width: 0 }, { width: (r.v / MAX) * BAR, duration: r.d, ease: "power2.out" }, r.t);
            TICK($("#val-" + r.id), r.v, r.t, r.d, (v) => "$" + v.toFixed(2));
            if (r.color) tl.set("#s04 #bar-" + r.id, { backgroundColor: r.color }, r.t);
          });
          // subagent: most expensive
          tl.fromTo("#s04 #val-sub", { color: "#eae6da" }, { color: "#f87171", duration: 0.3 }, 12.9);
          const most = document.createElement("span");
          most.className = "note mono rd"; most.id = "most"; most.textContent = "Most";
          $("#row-sub .bw").appendChild(most);
          POP("#s04 #most", 13.5);

          // reset halves cost
          tl.fromTo("#s04 #ref1", { scaleY: 0, opacity: 0.7 }, { scaleY: 1, opacity: 0.7, duration: 0.5, ease: "power2.out" }, 24.46);
          tl.fromTo("#s04 #ref1l", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 24.7);
          tl.fromTo("#s04 #ref2", { scaleY: 0, opacity: 0.7 }, { scaleY: 1, opacity: 0.7, duration: 0.5, ease: "power2.out" }, 25.3);
          tl.fromTo("#s04 #ref2l", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 25.5);
          tl.to("#s04 #cl", { opacity: 0, duration: 0.3 }, 24.2);
          // the mods deliver
          POP("#s04 #mod-cah", 27.84); POP("#s04 #mod-hc", 28.1);
          tl.to("#s04 #ref1", { opacity: 0, duration: 0.4 }, 29.8);
          tl.to("#s04 #ref1l", { opacity: 0, duration: 0.4 }, 29.8);
          tl.to("#s04 #ref2", { opacity: 0, duration: 0.4 }, 29.8);
          tl.to("#s04 #ref2l", { opacity: 0, duration: 0.4 }, 29.8);

          // sort by cost, /compact on top
          rows.forEach((r, i) => {
            tl.to(r.el, { y: (r.rank - i) * PITCH, duration: 0.9, ease: "power3.inOut" }, 30.9);
          });
          tl.to("#s04 #bar-compact", { backgroundColor: "#5eead4", duration: 0.4 }, 31.9);
          tl.to("#s04 #val-compact", { color: "#5eead4", duration: 0.4 }, 31.9);
          tl.to("#s04 #nm-compact", { color: "#5eead4", duration: 0.4 }, 31.9);
          tl.fromTo("#s04 #hl-compact", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 31.9);
          const ch = document.createElement("span");
          ch.className = "note mono cy"; ch.id = "cheap"; ch.textContent = "Cheapest";
          $("#row-compact .bw").appendChild(ch);
          POP("#s04 #cheap", 32.55);
          const bi = document.createElement("span");
          bi.className = "note mono cy"; bi.id = "builtin"; bi.textContent = "Built in";
          $("#row-compact .bw").appendChild(bi);
          POP("#s04 #builtin", 34.2);
          OUT("#s04 #chart", 35.8);

          // ---- stage 3 (36.2 to 41)
          tl.fromTo("#s04 #st3", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 36.2);
          const w3 = document.querySelectorAll("#s04 #s3h .w");
          [36.72, 37.1, 37.26].forEach((t, i) => tl.fromTo(w3[i], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t));
          tl.fromTo("#s04 #lb1", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 38.1);
          tl.fromTo("#s04 #lbchk", { strokeDasharray: 100, strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 38.5);
          tl.fromTo("#s04 #lb2", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 38.66);
          tl.fromTo("#s04 #lb3", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 39.0);
          OUT("#s04 #st3", 41.0);

          // ---- stage 4a (41.4 to 45)
          tl.fromTo("#s04 #st4a", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 41.4);
          POP("#s04 #why", 41.5);
          IN("#s04 #whysub", 41.86, 0.5);
          tl.fromTo("#s04 #term", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 42.3);
          WIPE("#s04 #tl1", 42.7, 0.5);
          WIPE("#s04 #tl2", 43.2, 0.8);
          tl.fromTo("#s04 #pill", { backgroundColor: "rgba(251,191,36,0)" }, { backgroundColor: "rgba(251,191,36,0.28)", duration: 0.3 }, 43.9);
          tl.fromTo("#s04 #tl3", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 44.4);
          POP("#s04 #s4atag", 44.2);
