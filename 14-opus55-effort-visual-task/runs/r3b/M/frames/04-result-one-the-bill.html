      <script>
        (function () {
          const $ = (s) => document.querySelector(s);
          const tl = gsap.timeline({ paused: true });

          const show = (sel, t) => tl.fromTo($(sel), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, t);
          const hide = (sel, t) => tl.to($(sel), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, t);
          const pop = (sel, t) => {
            tl.fromTo($(sel), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.05, duration: 0.25, ease: "power2.out" }, t);
            tl.to($(sel), { scale: 1, duration: 0.2, ease: "power1.inOut" }, t + 0.25);
          };
          const tick = (el, from, to, t, dur, fmt) => {
            const o = { v: from };
            el.textContent = fmt(from);
            tl.to(o, { v: to, duration: dur, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, t);
          };
          const usd = (v) => "$" + v.toFixed(2);

          // Stage A: 0 to 8.6
          show("#rb-a", 0);
          tl.fromTo($("#rb-a-title"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.9);
          tl.fromTo($("#rb-a-def"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.9);
          tl.fromTo($("#rb-a-div"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 3.4);
          pop("#rb-a-t1", 4.4);
          pop("#rb-a-t2", 6.0);
          pop("#rb-a-t3", 7.0);
          hide("#rb-a", 8.4);

          // Stage B: ranked chart, 8.8 to 30.5
          show("#rb-b", 8.8);
          const rows = [
            { name: "/compact", v: 0.53, t: 14.72, tv: 15.96, bar: "#2d6e62" },
            { name: "brief handoff", v: 0.57, t: 17.04, tv: 17.78, bar: "#2d6e62" },
            { name: "claude-auto-handoff", v: 0.66, t: 18.82, tv: 19.76, bar: "#2d6e62", mod: true },
            { name: "handoff-compact", v: 0.73, t: 20.72, tv: 21.8, bar: "#2d6e62", mod: true },
            { name: "no reset", v: 0.95, t: 8.96, tv: 9.9, bar: "#4a4326" },
            { name: "subagent", v: 1.2, t: 11.7, tv: 12.62, bar: "#f87171", flag: "MOST OF ANY SETUP", flagT: 13.5, flagC: "rd" },
          ];
          const MAXW = 900, MAXV = 1.2;
          const host = $("#rb-rows");
          rows.forEach((r, i) => {
            const row = document.createElement("div");
            row.className = "rb-row";
            row.style.top = i * 110 + "px";
            const w = Math.round((r.v / MAXV) * MAXW);
            row.innerHTML =
              '<div class="hl"></div>' +
              '<div class="rank">0' + (i + 1) + "</div>" +
              '<div class="name">' + r.name + "</div>" +
              '<div class="track"><div class="bar" style="width:' + w + "px;background:" + r.bar + '"></div></div>' +
              '<div class="val">$0.00</div>';
            host.appendChild(row);
            r.el = row;
            tl.fromTo(row, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, r.t);
            tl.fromTo(row.querySelector(".bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, r.tv - 0.1);
            tick(row.querySelector(".val"), 0, r.v, r.tv - 0.1, 0.9, usd);
            if (r.flag) {
              const f = document.createElement("div");
              f.className = "flag " + r.flagC;
              f.textContent = r.flag;
              f.style.left = w + 20 + "px";
              row.querySelector(".track").appendChild(f);
              f.style.left = "20px";
              f.style.color = "#0b0c10";
              f.style.opacity = 0;
              tl.set(row.querySelector(".val"), { color: "#f87171" }, r.flagT);
            }
            if (r.mod) {
              const f = document.createElement("div");
              f.className = "flag am";
              f.textContent = "MOD";
              f.style.left = w + 20 + "px";
              f.style.opacity = 0;
              row.querySelector(".track").appendChild(f);
              r.modFlag = f;
            }
          });
          const subFlag = rows[5].el.querySelector(".flag");
          tl.fromTo(subFlag, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 13.5);

          // "a reset roughly halves": half-of-no-reset marker
          const halfX = 90 + 500 + Math.round((0.95 / 2 / MAXV) * MAXW);
          $("#rb-half").style.left = halfX + "px";
          $("#rb-half-l").style.left = halfX - 150 + "px";
          tl.fromTo($("#rb-half"), { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.7, ease: "power2.out", transformOrigin: "top center" }, 24.4);
          tl.fromTo($("#rb-half-l"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 24.9);
          for (let i = 0; i < 4; i++) {
            const hl = rows[i].el.querySelector(".hl");
            hl.style.background = "rgba(94, 234, 212, 0.07)";
            tl.fromTo(hl, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 25.3 + i * 0.12);
          }
          // "the mods deliver on that"
          [rows[2], rows[3]].forEach((r, k) => {
            tl.fromTo(r.modFlag, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 27.84 + k * 0.15);
            tl.to(r.el.querySelector(".hl"), { background: "rgba(251, 191, 36, 0.12)", duration: 0.3 }, 27.84 + k * 0.15);
          });
          // "/compact" winner pulse just before the swap
          tl.to(rows[0].el.querySelector(".bar"), { background: "#5eead4", duration: 0.4 }, 29.4);
          tl.to(rows[0].el.querySelector(".val"), { color: "#5eead4", duration: 0.4 }, 29.4);
          hide("#rb-b", 30.6);

          // Stage C: cheapest, 31.0 to 41.2
          show("#rb-c", 31.0);
          tick($("#rb-c-val"), 1.2, 0.53, 31.1, 1.2, usd);
          tl.fromTo($("#rb-c-name"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 32.5);
          tl.fromTo($("#rb-c-sub"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 33.8);
          pop("#rb-c-p1", 36.72);
          pop("#rb-c-p2", 38.3);
          tl.fromTo($("#rb-c-vs"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 38.6);
          hide("#rb-c", 41.1);

          // Stage D: extra model call, 41.5 to 45.0
          show("#rb-d", 41.5);
          ["#rb-l1", "#rb-l2", "#rb-l3", "#rb-l4"].forEach((s, i) => {
            tl.fromTo($(s), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25 }, 42.2 + i * 0.25);
          });
          tl.fromTo($("#rb-call-glow"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 43.5);
          tl.to($("#rb-call"), { color: "#fbbf24", duration: 0.3 }, 43.5);
          tl.fromTo($("#rb-call"), { scale: 1 }, { scale: 1.06, duration: 0.2, yoyo: true, repeat: 1 }, 43.86);
          hide("#rb-d", 45.0);

          // Stage E: context left after reset, 45.4 to 59.4
          show("#rb-e", 45.4);
          const W = 1728, MAXK = 100;
          $("#rb-e-f1").style.width = Math.round((69 / MAXK) * W) + "px";
          $("#rb-e-f2").style.width = Math.round((47 / MAXK) * W) + "px";
          $("#rb-e-g1").style.left = Math.round((69 / MAXK) * W) + "px";
          $("#rb-e-g1").style.width = Math.round(((93 - 69) / MAXK) * W) + "px";
          $("#rb-e-grow-l").style.left = Math.round((69 / MAXK) * W) + "px";
          tl.fromTo($("#rb-e-r1"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 45.6);
          tl.fromTo($("#rb-e-f1"), { scaleX: 0 }, { scaleX: 60 / 69, duration: 0.7, ease: "power2.out" }, 46.6);
          tl.to($("#rb-e-f1"), { scaleX: 1, duration: 0.6, ease: "power2.out" }, 47.4);
          tl.fromTo($("#rb-e-v1"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 46.6);
          tl.fromTo($("#rb-e-r2"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 49.7);
          tl.fromTo($("#rb-e-f2"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 50.4);
          tl.fromTo($("#rb-e-v2"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 50.4);
          // "the context grew back"
          tl.fromTo($("#rb-e-g1"), { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.out" }, 54.9);
          tl.fromTo($("#rb-e-grow-l"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 55.2);
          // "every follow-up pays"
          const turns = $("#rb-e-turns");
          tl.fromTo(turns, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 55.9);
          for (let i = 0; i < 8; i++) {
            const t = document.createElement("div");
            t.className = "t";
            t.textContent = "TURN " + (i + 1);
            t.style.width = "120px";
            turns.appendChild(t);
            tl.to(t, { background: "rgba(251, 191, 36, 0.55)", color: "#0b0c10", duration: 0.15 }, 56.3 + i * 0.18);
          }
          hide("#rb-e", 59.4);

          // Stage F: close, 59.8 to end
          show("#rb-f", 59.75);
          tl.fromTo($("#rb-f1"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 59.9);
          tl.fromTo($("#rb-f2"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 61.5);
          tl.to({}, { duration: 0.1 }, 64.4);

          window.__timelines["04-result-one-the-bill"] = tl;
        })();
      </script>
    </template>
  </body>
