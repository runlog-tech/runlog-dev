      (function () {

        // A: 0 - 8.7 (bill 1.08, "cost of every turn" 2.06, "Sonnet 5.5" 6.08)

        tl.fromTo('#s4-a-lab', { opacity: 0 }, { opacity: 1, duration: .3 }, 0.3);
        tl.fromTo('#s4-a-h', { opacity: 0 }, { opacity: 1, duration: .5 }, 1.64);
        const typed = { n: 0 };
        const line = '8 turns, mean of the runs';
        tl.to(typed, { n: line.length, duration: 1.6, ease: 'none', onUpdate: () => { $('#s4-a-typed').textContent = line.slice(0, Math.round(typed.n)); } }, 4.4);
        tl.set('#s4-a-typed', { textContent: '' }, 0);
        const t2 = { n: 0 }; const line2 = 'sonnet-5.5';
        tl.to(t2, { n: line2.length, duration: .8, ease: 'none', onUpdate: () => { $('#s4-a-typed').textContent = line.slice(0, Math.round(typed.n)) + (t2.n > 0 ? '  |  ' + line2.slice(0, Math.round(t2.n)) : ''); } }, 6.0);
        tl.fromTo('#s4-a-caret', { opacity: 1 }, { opacity: 0, duration: .25, repeat: 11, yoyo: true, ease: 'none' }, 4.4);
        OUT('#s4-a', 8.4);

        // B: rows on spoken words
        IN('#s4-b', 8.7);
        const row = (id, t, w) => {
          tl.fromTo(id, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .45, ease: 'power2.out' }, t);
          tl.fromTo(id + ' .bar', { scaleX: 0 }, { scaleX: 1, duration: .7, ease: 'power3.out' }, t);
        };
        row('#r-none', 9.0); row('#r-sub', 11.7); row('#r-comp', 14.6); row('#r-brief', 17.0); row('#r-cah', 18.8); row('#r-hc', 20.7);

        tl.fromTo('#t-comp', { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .4, ease: 'back.out(2.5)' }, 22.4);
        OUT('#s4-b', 23.8);

        // C: halves, "reset" 24.46 "halves" 25.32 "mods deliver" 27.7
        IN('#s4-c', 24.1);
        const cols = document.querySelectorAll('#s4-c .big');
        tl.fromTo(cols[0], { opacity: 0 }, { opacity: 1, duration: .4, immediateRender: false }, 24.3);
        tl.fromTo('#s4-c .arrow', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .5, ease: 'power2.out' }, 25.2);
        tl.fromTo(cols[1], { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .5, ease: 'back.out(2)', immediateRender: false }, 25.5);
        tl.fromTo('#s4-c .sub', { opacity: 0 }, { opacity: 1, duration: .5 }, 27.6);
        OUT('#s4-c', 29.9);

        // D: cheapest, "cheapest" 31.14, "one you already have" 33.8, "Nothing to install" 36.7, "beat both mods" 38.3
        IN('#s4-d', 30.6);
        tl.fromTo('#s4-d .lab.cy', { opacity: 0 }, { opacity: 1, duration: .4 }, 31.1);
        pop('#s4-d-h', 32.5);
        tl.fromTo('#s4-d .sub', { opacity: 0 }, { opacity: 1, duration: .5 }, 36.7);
        tl.fromTo('#s4-d-mods', { opacity: 0 }, { opacity: 1, duration: .5 }, 37.9);
        tl.fromTo('#s4-d-mods .big', { opacity: 1 }, { opacity: 1, duration: .01 }, 37.9);
        tl.fromTo('#s4-d-beat', { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .4, ease: 'back.out(2.5)' }, 38.7);
        OUT('#s4-d', 40.4);

        tl.fromTo('#s4-e1 .h1', { opacity: 0 }, { opacity: 1, duration: .4 }, 41.86);
        pop('#s4-e1-h', 42.9);
        tl.fromTo('#s4-e1 .sub', { opacity: 0 }, { opacity: 1, duration: .4 }, 44.1);
        OUT('#s4-e1', 45.0);

        IN('#s4-e2', 45.3);
