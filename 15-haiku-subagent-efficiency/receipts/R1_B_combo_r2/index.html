<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08090c; }
  #bg { position: absolute; inset: 0; background: #08090c; }
  #title { position: absolute; left: 120px; top: 90px; width: 1680px; font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 84px; color: #f8fafc; opacity: 0; }
  .row-label { position: absolute; left: 120px; width: 320px; height: 90px; line-height: 90px; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 44px; color: #f8fafc; white-space: nowrap; }
  .bar { position: absolute; left: 460px; height: 90px; background: #38bdf8; transform-origin: 0% 50%; }
  .bar.accent { background: #f59e0b; }
  .row-value { position: absolute; height: 90px; line-height: 90px; font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 48px; color: #f8fafc; white-space: nowrap; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div id="bg"></div>
  <div id="title">COST PER CONTEXT TOKEN</div>

  <div class="row-label" style="top: 300px;">0 to 50K</div>
  <div class="bar" id="bar-0" style="top: 300px; width: 255px;"></div>
  <div class="row-value" id="val-0" style="top: 300px; left: 739px; width: 200px;">$0.051</div>

  <div class="row-label" style="top: 460px;">50 to 100K</div>
  <div class="bar" id="bar-1" style="top: 460px; width: 340px;"></div>
  <div class="row-value" id="val-1" style="top: 460px; left: 824px; width: 200px;">$0.068</div>

  <div class="row-label" style="top: 620px;">100 to 150K</div>
  <div class="bar accent" id="bar-2" style="top: 620px; width: 985px;"></div>
  <div class="row-value" id="val-2" style="top: 620px; left: 1469px; width: 200px;">$0.197</div>

  <div class="row-label" style="top: 780px;">150 to 250K</div>
  <div class="bar" id="bar-3" style="top: 780px; width: 765px;"></div>
  <div class="row-value" id="val-3" style="top: 780px; left: 1249px; width: 200px;">$0.153</div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.to("#title", { opacity: 1, duration: 0.6 }, 0.3);
  const bars = gsap.utils.toArray(".bar");
  const values = gsap.utils.toArray(".row-value");
  tl.fromTo(bars, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out", stagger: 0.35 }, 0.6);
  tl.to(values, { opacity: 1, duration: 0.4, stagger: 0.35 }, 1.5);
  tl.set({}, {}, 6);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
