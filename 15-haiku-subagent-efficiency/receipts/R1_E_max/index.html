<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08090c; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #08090c; font-family: Arial, Helvetica, sans-serif; color: #f8fafc; }
  #bg { position: absolute; inset: 0; background: radial-gradient(900px 520px at 0% 0%, rgba(57, 135, 229, 0.10), rgba(57, 135, 229, 0) 70%); }
  .abs { position: absolute; white-space: nowrap; }
  #eyebrow { left: 120px; top: 104px; font-size: 24px; font-weight: 700; letter-spacing: 0.2em; color: #94a3b8; }
  #title { left: 120px; top: 140px; font-size: 84px; font-weight: 800; line-height: 1; color: #f8fafc; }
  #rule { left: 120px; top: 280px; width: 1680px; height: 1px; background: #1b202a; transform-origin: 0% 50%; }
  #colhead { left: 120px; top: 330px; font-size: 20px; font-weight: 700; letter-spacing: 0.16em; color: #7b8496; }
  #axis { left: 420px; top: 396px; width: 1px; height: 498px; background: #2e3442; transform-origin: 50% 0%; }
  .row-label { left: 120px; width: 260px; height: 44px; line-height: 44px; font-size: 34px; font-weight: 700; color: #cbd5e1; }
  .bar { left: 420px; height: 24px; background: #3987e5; border-radius: 0 4px 4px 0; transform-origin: 0% 50%; }
  .val { left: 420px; height: 52px; line-height: 52px; font-size: 40px; font-weight: 700; color: #f8fafc; }
  #caption { left: 420px; top: 930px; font-size: 20px; color: #7b8496; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div id="bg"></div>
  <div id="eyebrow" class="abs">PRICING BY CONTEXT SIZE</div>
  <div id="title" class="abs">Cost per million context tokens</div>
  <div id="rule" class="abs"></div>
  <div id="colhead" class="abs">CONTEXT SIZE (TOKENS)</div>
  <div id="axis" class="abs"></div>

  <div id="label-0" class="abs row-label" style="top: 398px">0&ndash;50K</div>
  <div id="bar-0" class="abs bar" style="top: 408px; width: 281.52px"></div>
  <div id="val-0" class="abs val" style="top: 394px">$0.000</div>

  <div id="label-1" class="abs row-label" style="top: 548px">50&ndash;100K</div>
  <div id="bar-1" class="abs bar" style="top: 558px; width: 375.36px"></div>
  <div id="val-1" class="abs val" style="top: 544px">$0.000</div>

  <div id="label-2" class="abs row-label" style="top: 698px">100&ndash;150K</div>
  <div id="bar-2" class="abs bar" style="top: 708px; width: 1087.44px"></div>
  <div id="val-2" class="abs val" style="top: 694px">$0.000</div>

  <div id="label-3" class="abs row-label" style="top: 848px">150&ndash;250K</div>
  <div id="bar-3" class="abs bar" style="top: 858px; width: 844.56px"></div>
  <div id="val-3" class="abs val" style="top: 844px">$0.000</div>

  <div id="caption" class="abs">USD per 1M context tokens</div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });

  // Header and zero line
  tl.fromTo("#eyebrow", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.15);
  tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.3);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power3.out" }, 0.6);
  tl.fromTo("#colhead", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.8);
  tl.fromTo("#axis", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power2.out" }, 0.8);
  tl.fromTo("#caption", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 1.1);

  // Rows: label slides in, bar grows from the zero line, value counts up and rides the bar tip.
  // Scale is 5520px per USD (0.25 USD = 1380px), so bar width = value * 5520.
  const PX_PER_USD = 5520;
  const TIP_GAP = 22;
  const ROWS = [0.051, 0.068, 0.197, 0.153];
  ROWS.forEach((value, i) => {
    const barW = value * PX_PER_USD;
    const at = 1.3 + 0.16 * i;
    const valEl = document.getElementById("val-" + i);
    const counter = { v: 0 };
    tl.fromTo("#label-" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.9 + 0.12 * i);
    tl.fromTo("#bar-" + i, { scaleX: 0 }, { scaleX: 1, duration: 1.6, ease: "power3.out" }, at);
    tl.fromTo(valEl, { opacity: 0, x: TIP_GAP }, { opacity: 1, x: barW + TIP_GAP, duration: 1.6, ease: "power3.out" }, at);
    tl.fromTo(counter, { v: 0 }, { v: value, duration: 1.6, ease: "power3.out", onUpdate: () => { valEl.textContent = "$" + counter.v.toFixed(3); } }, at);
  });

  window.__timelines["main"] = tl;
</script>
</body>
</html>
