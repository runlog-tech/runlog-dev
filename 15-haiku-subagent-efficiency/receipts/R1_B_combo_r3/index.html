<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08090c; }
  #bg { position: absolute; inset: 0; background: #08090c; }
  #title { position: absolute; left: 120px; top: 90px; width: 1680px; font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 84px; color: #f8fafc; opacity: 0; }
  .row { position: absolute; left: 0; width: 1920px; height: 96px; font-family: Arial, Helvetica, sans-serif; font-size: 44px; font-weight: 700; color: #f8fafc; line-height: 96px; }
  .lbl { position: absolute; left: 120px; top: 0; width: 380px; white-space: nowrap; }
  .bar { position: absolute; left: 520px; top: 0; height: 96px; background: #38bdf8; transform-origin: left center; }
  .bar.hl { background: #f59e0b; }
  .val { position: absolute; top: 0; white-space: nowrap; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div id="bg"></div>
  <div id="title">COST PER CONTEXT TOKEN</div>

  <div class="row" style="top: 300px;">
    <div class="lbl">0 to 50K</div>
    <div class="bar" style="width: 285px;"></div>
    <div class="val" style="left: 829px;">$0.051</div>
  </div>

  <div class="row" style="top: 460px;">
    <div class="lbl">50 to 100K</div>
    <div class="bar" style="width: 380px;"></div>
    <div class="val" style="left: 924px;">$0.068</div>
  </div>

  <div class="row" style="top: 620px;">
    <div class="lbl">100 to 150K</div>
    <div class="bar hl" style="width: 1100px;"></div>
    <div class="val" style="left: 1644px;">$0.197</div>
  </div>

  <div class="row" style="top: 780px;">
    <div class="lbl">150 to 250K</div>
    <div class="bar" style="width: 854px;"></div>
    <div class="val" style="left: 1398px;">$0.153</div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.to("#title", { opacity: 1, duration: 0.6 }, 0.3);
  tl.fromTo(".bar", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out", stagger: 0.35 }, 1.0);
  tl.to(".val", { opacity: 1, duration: 0.4, stagger: 0.35 }, 1.9);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
