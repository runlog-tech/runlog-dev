<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08090c; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Arial, Helvetica, sans-serif; color: #f0efec; }
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 1400px 800px at 70% 30%, #0f1620 0%, #08090c 70%); }

  #eyebrow { position: absolute; left: 120px; top: 92px; font-size: 26px; font-weight: 700; letter-spacing: 6px; color: #5598e7; opacity: 0; }
  #title { position: absolute; left: 120px; top: 136px; width: 1680px; font-size: 76px; font-weight: 800; color: #f8fafc; opacity: 0; }
  #subtitle { position: absolute; left: 120px; top: 232px; width: 1680px; font-size: 30px; font-weight: 400; color: #c3c2b7; opacity: 0; }
  #rule { position: absolute; left: 120px; top: 300px; width: 1680px; height: 2px; background: #1f2630; }

  #chart { position: absolute; left: 120px; top: 360px; width: 1680px; height: 600px; }
  .row { position: absolute; left: 0; width: 1680px; height: 84px; display: flex; align-items: center; }
  .row-0 { top: 0; }
  .row-1 { top: 150px; }
  .row-2 { top: 300px; }
  .row-3 { top: 450px; }

  .label { width: 320px; flex: 0 0 320px; font-size: 38px; font-weight: 700; color: #e2e8f0; opacity: 0; }
  .track { position: relative; flex: 1 1 auto; height: 84px; margin-left: 20px; background: #12161e; border-radius: 12px; }
  .bar { position: absolute; left: 0; top: 0; height: 84px; width: 0; border-radius: 12px; background: #256abf; }
  .bar.peak { background: #5598e7; }

  .value { width: 220px; flex: 0 0 220px; margin-left: 40px; display: flex; align-items: center; opacity: 0; }
  .value-num { font-size: 52px; font-weight: 800; color: #f8fafc; }
  .tag { display: inline-block; margin-left: 14px; padding: 6px 12px; font-size: 18px; font-weight: 800; letter-spacing: 2px; color: #86b6ef; border: 2px solid #5598e7; border-radius: 999px; opacity: 0; }

  #footer { position: absolute; left: 120px; top: 1000px; width: 1680px; font-size: 24px; color: #94a3b8; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div id="bg"></div>
  <div id="eyebrow">CONTEXT PRICING</div>
  <div id="title">Cost per million context tokens</div>
  <div id="subtitle">Price by context window size, USD per 1M tokens</div>
  <div id="rule"></div>

  <div id="chart">
    <div class="row row-0">
      <div class="label">0 to 50K</div>
      <div class="track"><div class="bar" data-value="0.051"></div></div>
      <div class="value"><span class="value-num">$0.000</span></div>
    </div>
    <div class="row row-1">
      <div class="label">50 to 100K</div>
      <div class="track"><div class="bar" data-value="0.068"></div></div>
      <div class="value"><span class="value-num">$0.000</span></div>
    </div>
    <div class="row row-2">
      <div class="label">100 to 150K</div>
      <div class="track"><div class="bar peak" data-value="0.197"></div></div>
      <div class="value"><span class="value-num">$0.000</span><span class="tag">PEAK</span></div>
    </div>
    <div class="row row-3">
      <div class="label">150 to 250K</div>
      <div class="track"><div class="bar" data-value="0.153"></div></div>
      <div class="value"><span class="value-num">$0.000</span></div>
    </div>
  </div>

  <div id="footer">Context size in tokens. Bar length scaled to a $0.20 maximum.</div>
</div>
<script>
  const MAX = 0.20;
  const START = 0.9, STEP = 0.2, DUR = 1.2;
  const tl = gsap.timeline({ paused: true });

  tl.fromTo("#eyebrow", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.1);
  tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.25);
  tl.fromTo("#subtitle", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.45);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut", transformOrigin: "0% 50%" }, 0.5);

  document.querySelectorAll(".row").forEach((row, i) => {
    const t = START + i * STEP;
    const bar = row.querySelector(".bar");
    const track = row.querySelector(".track");
    const label = row.querySelector(".label");
    const value = row.querySelector(".value");
    const valueNum = row.querySelector(".value-num");
    const target = track.clientWidth * (parseFloat(bar.dataset.value) / MAX);
    const counter = { v: 0 };

    tl.fromTo(label, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, t);
    tl.fromTo(value, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, t + 0.2);
    tl.fromTo(bar, { width: 0 }, { width: target, duration: DUR, ease: "power3.out" }, t + 0.1);
    tl.to(counter, {
      v: parseFloat(bar.dataset.value),
      duration: DUR,
      ease: "power2.out",
      onUpdate: () => { valueNum.textContent = "$" + counter.v.toFixed(3); }
    }, t + 0.1);
  });

  const tag = document.querySelector(".tag");
  tl.to(tag, { opacity: 1, duration: 0.4, ease: "power1.out" }, START + 2 * STEP + DUR * 0.8);
  tl.to(".bar.peak", {
    boxShadow: "0 0 40px 6px rgba(85,152,231,0.45)",
    duration: 0.5,
    ease: "sine.inOut",
    yoyo: true,
    repeat: 1
  }, 3.4);
  tl.fromTo("#footer", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 2.6);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
