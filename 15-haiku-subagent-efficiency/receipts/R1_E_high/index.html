<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08090c; }
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 40%, #0f172a 0%, #08090c 70%); }
  #title { position: absolute; left: 120px; top: 90px; width: 1680px; font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 84px; color: #f8fafc; opacity: 0; }
  #sub { position: absolute; left: 120px; top: 196px; width: 1680px; font-family: Arial, Helvetica, sans-serif; font-weight: 400; font-size: 34px; color: #94a3b8; opacity: 0; }
  .grid { position: absolute; top: 320px; width: 2px; height: 580px; background: rgba(148, 163, 184, 0.14); opacity: 0; }
  .base { background: rgba(203, 213, 225, 0.45); opacity: 1; }
  .tick { position: absolute; top: 912px; width: 120px; text-align: center; font-family: Arial, Helvetica, sans-serif; font-size: 22px; color: #94a3b8; }
  .row { position: absolute; left: 120px; width: 1680px; height: 110px; font-family: Arial, Helvetica, sans-serif; }
  .name { position: absolute; left: 0; top: 0; height: 110px; display: flex; flex-direction: column; justify-content: center; opacity: 0; }
  .name b { font-size: 36px; font-weight: 800; color: #f8fafc; }
  .name span { margin-top: 4px; font-size: 22px; color: #94a3b8; }
  .track { position: absolute; left: 240px; top: 25px; width: 1100px; height: 60px; border-radius: 30px; background: rgba(148, 163, 184, 0.10); }
  .fill { position: absolute; left: 0; top: 0; height: 60px; border-radius: 30px; transform-origin: 0 50%; background: linear-gradient(90deg, #1d4ed8, #38bdf8); }
  .fill.peak { background: linear-gradient(90deg, #b45309, #fbbf24); }
  .val { position: absolute; top: 25px; height: 60px; line-height: 60px; font-size: 44px; font-weight: 800; color: #e2e8f0; font-variant-numeric: tabular-nums; }
  .val.peak { color: #fbbf24; }
  #pill { position: absolute; left: 1540px; top: 40px; height: 30px; line-height: 28px; padding: 0 14px; border: 1px solid #fbbf24; border-radius: 15px; color: #fbbf24; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 3px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div id="bg"></div>
  <div id="title">Cost per million context tokens</div>
  <div id="sub">USD per 1M tokens, by context window size</div>

  <div class="grid base" style="left: 359px;"></div>
  <div class="grid" style="left: 638px;"></div>
  <div class="grid" style="left: 917px;"></div>
  <div class="grid" style="left: 1197px;"></div>
  <div class="tick" style="left: 579px;">$0.05</div>
  <div class="tick" style="left: 858px;">$0.10</div>
  <div class="tick" style="left: 1138px;">$0.15</div>

  <div class="row" id="r0" style="top: 340px;">
    <div class="name"><b>0–50K</b><span>context tokens</span></div>
    <div class="track"><div class="fill" style="width: 285px;"></div></div>
    <div class="val" id="v0" style="left: 549px;">$0.000</div>
  </div>

  <div class="row" id="r1" style="top: 490px;">
    <div class="name"><b>50–100K</b><span>context tokens</span></div>
    <div class="track"><div class="fill" style="width: 380px;"></div></div>
    <div class="val" id="v1" style="left: 644px;">$0.000</div>
  </div>

  <div class="row" id="r2" style="top: 640px;">
    <div class="name"><b>100–150K</b><span>context tokens</span></div>
    <div class="track"><div class="fill peak" style="width: 1100px;"></div></div>
    <div class="val peak" id="v2" style="left: 1364px;">$0.000</div>
    <div id="pill">HIGHEST</div>
  </div>

  <div class="row" id="r3" style="top: 790px;">
    <div class="name"><b>150–250K</b><span>context tokens</span></div>
    <div class="track"><div class="fill" style="width: 854px;"></div></div>
    <div class="val" id="v3" style="left: 1118px;">$0.000</div>
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });

  tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
  tl.fromTo("#sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.45);
  tl.fromTo(".grid:not(.base)", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0.6);

  const rows = [
    { name: "#r0 .name", fill: "#r0 .fill", val: "#v0", value: 0.051 },
    { name: "#r1 .name", fill: "#r1 .fill", val: "#v1", value: 0.068 },
    { name: "#r2 .name", fill: "#r2 .fill", val: "#v2", value: 0.197 },
    { name: "#r3 .name", fill: "#r3 .fill", val: "#v3", value: 0.153 },
  ];

  rows.forEach((row, i) => {
    const t0 = 0.9 + i * 0.22;
    tl.fromTo(row.name, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, t0);
    tl.fromTo(row.fill, { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power3.out" }, t0 + 0.1);

    const label = document.getElementById(row.val.slice(1));
    const counter = { v: 0 };
    tl.fromTo(counter, { v: 0 }, {
      v: row.value,
      duration: 1.3,
      ease: "power3.out",
      onUpdate: () => { label.textContent = "$" + counter.v.toFixed(3); },
    }, t0 + 0.1);
  });

  tl.fromTo("#pill", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.7)" }, 3.4);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
