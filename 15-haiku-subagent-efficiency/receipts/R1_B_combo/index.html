<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08090c; }
  #bg { position: absolute; inset: 0; background: #08090c; }
  #title { position: absolute; left: 120px; top: 90px; width: 1680px; font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 84px; color: #f8fafc; opacity: 0; }
  .row { position: absolute; left: 0; top: 0; width: 1920px; height: 90px; font-family: Arial, Helvetica, sans-serif; }
  .label { position: absolute; left: 120px; top: 0; width: 380px; height: 90px; line-height: 90px; font-size: 44px; font-weight: 600; color: #e2e8f0; white-space: nowrap; }
  .bar { position: absolute; left: 540px; top: 0; width: 0; height: 90px; background: #38bdf8; }
  .bar.accent { background: #f97316; }
  .val { position: absolute; top: 0; height: 90px; line-height: 90px; font-size: 48px; font-weight: 700; color: #f8fafc; white-space: nowrap; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div id="bg"></div>
  <div id="title">COST PER CONTEXT TOKEN</div>
  <div class="row" style="top: 300px;">
    <div class="label">0 to 50K</div>
    <div class="bar" data-w="284.8"></div>
    <div class="val" style="left: 848.8px;">$0.051</div>
  </div>
  <div class="row" style="top: 460px;">
    <div class="label">50 to 100K</div>
    <div class="bar" data-w="379.7"></div>
    <div class="val" style="left: 943.7px;">$0.068</div>
  </div>
  <div class="row" style="top: 620px;">
    <div class="label">100 to 150K</div>
    <div class="bar accent" data-w="1100"></div>
    <div class="val" style="left: 1664px;">$0.197</div>
  </div>
  <div class="row" style="top: 780px;">
    <div class="label">150 to 250K</div>
    <div class="bar" data-w="854.3"></div>
    <div class="val" style="left: 1418.3px;">$0.153</div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.to("#title", { opacity: 1, duration: 0.6 }, 0.3);
  tl.fromTo(".bar", { width: 0 }, { width: (i, el) => el.dataset.w + "px", duration: 0.9, ease: "power2.out", stagger: 0.35 }, 0.8);
  tl.fromTo(".val", { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.35 }, 1.6);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
